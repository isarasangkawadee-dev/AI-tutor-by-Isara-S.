services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aitutor
      POSTGRES_USER: aitutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_2026}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U aitutor -d aitutor"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: ./apps/web/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aitutor:${POSTGRES_PASSWORD:-dev_password_2026}@db:5432/aitutor?schema=public
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    restart: unless-stopped
volumes: { pgdata: {} }
